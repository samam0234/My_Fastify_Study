services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      APP_STAGE: final
      HOST: 0.0.0.0
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      DB_CLIENT: sqlite
      SQLITE_PATH: /data/board.db
      UPLOAD_DIR: /data/uploads
      OUTBOX_DIR: /data/outbox
      COOKIE_SECURE: "false"
      PUBLIC_BASE_URL: http://127.0.0.1:3000
      CORS_ORIGIN: http://127.0.0.1:3000
    volumes:
      - board-data:/data
  postgres:
    profiles: ["postgres"]
    image: postgres:16
    environment:
      POSTGRES_USER: study
      POSTGRES_PASSWORD: study
      POSTGRES_DB: study
    ports:
      - "5432:5432"
  mariadb:
    profiles: ["mariadb"]
    image: mariadb:11
    environment:
      MARIADB_USER: study
      MARIADB_PASSWORD: study
      MARIADB_DATABASE: study
      MARIADB_ROOT_PASSWORD: study
    ports:
      - "3306:3306"
  mongo:
    profiles: ["mongo"]
    image: mongo:7
    ports:
      - "27017:27017"
volumes:
  board-data: {}
